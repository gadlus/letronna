[package]
name = "letronna-core"
description = "The agent: transport, tools, sessions and the loop, with no user interface"
version.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
async-channel.workspace = true
reqwest.workspace = true
chrono.workspace = true
# Checking that an update is signed and whole: ring is already here under
# rustls, and semver already in the lock file.
ring = "0.17"
semver = "1"
# The search tool: ripgrep's walker, which honours .gitignore, and its
# regex engine, both already in the lock file under the window's crates.
ignore = "0.4"
regex = "1"
# Discord's Gateway, for hearing server mentions as they happen. Blocking
# like reqwest here, and on the same rustls.
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
# Runs workflow scripts: QuickJS, in C built by cc, which ring already
# needs. It can be stopped from outside and held to a heap and a stack.
rquickjs = { version = "0.14", optional = true }
# Refusing a Cargo.toml or pyproject.toml a write would break; toml 1 is
# already in the lock file, and only its parser is needed.
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
# Turning a picture an image edit would refuse into a PNG, scaling down one
# too big to send, and reading a mask's size; already in the lock file under
# the window, which takes more of its formats.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

# Stopping a background job ends everything it started: a Job Object on
# Windows, a process group elsewhere; a Ctrl-C is heard by a console handler
# on one and a signal on the other. Both are already in the lock file,
# windows-sys at the version the window uses. Credential Manager keeps the
# keys and tokens on Windows. Both also keep Letronna alive through Ctrl-C
# while an editor has the terminal (interrupt.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Credentials", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
# Also stops a git that ran past its time together with what it started.
libc = "0.2"
# The time zone's name in the system prompt; chrono already reads it with
# this crate here, so it is in the lock file and built.
iana-time-zone = "0.1"

# The login Keychain keeps the keys and tokens on macOS; already in the lock
# file under rustls-native-certs. Computer use on macOS: the window list,
# pictures of windows and made-up input through Core Graphics, at the
# versions the window already uses; scroll events need "highsierra" and
# events sent to one app "elcapitan".
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
core-foundation = "0.10"
core-graphics = { version = "0.24", features = ["highsierra", "elcapitan"] }

# Computer use on Linux: X11 through x11rb, which the window already uses,
# with XTest for input and X-Resource for which process owns a window;
# AT-SPI's element tree over zbus, already here under the tray; and image,
# already here under the window, for the PNG, or the JPEG where that is
# too large to send. Confining a command on Linux: Landlock through its
# own crate, whose enumflags2 and thiserror are already in the lock file;
# the seccomp filter beside it needs only libc.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xtest", "res"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
landlock = "0.4"

[features]
default = ["workflows"]
# Orchestration scripts that run many agents at once. On by default, so CI
# builds, lints and tests it; a build without it leaves the runtime out.
workflows = ["dep:rquickjs"]
