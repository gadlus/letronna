[package]
name = "letronna-core"
description = "The agent: transport, tools, sessions and the loop, with no user interface"
version.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
async-channel.workspace = true
reqwest.workspace = true
chrono.workspace = true
# Checking that an update is signed and whole: ring is already here under
# rustls, and semver already in the lock file.
ring = "0.17"
semver = "1"
# Discord's Gateway, for hearing server mentions as they happen. Blocking
# like reqwest here, and on the same rustls.
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
# Runs workflow scripts: QuickJS, in C built by cc, which ring already
# needs. It can be stopped from outside and held to a heap and a stack.
rquickjs = { version = "0.14", optional = true }

[target.'cfg(unix)'.dependencies]
# Stops a git that ran past its time together with what it started; already
# in the lock file under several crates.
libc = "0.2"

[features]
default = ["workflows"]
# Orchestration scripts that run many agents at once. On by default, so CI
# builds, lints and tests it; a build without it leaves the runtime out.
workflows = ["dep:rquickjs"]
