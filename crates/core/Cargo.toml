[package]
name = "letronna-core"
description = "The agent: transport, tools, sessions and the loop, with no user interface"
version.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
async-channel.workspace = true
reqwest.workspace = true
chrono.workspace = true
# Checking that an update is signed and whole: ring is already here under
# rustls, and semver already in the lock file.
ring = "0.17"
semver = "1"
# The search tool: ripgrep's walker, which honours .gitignore, and its
# regex engine, both already in the lock file under the window's crates.
ignore = "0.4"
regex = "1"
# Discord's Gateway, for hearing server mentions as they happen. Blocking
# like reqwest here, and on the same rustls.
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
# Refusing a Cargo.toml or pyproject.toml a write would break; toml 1 is
# already in the lock file, and only its parser is needed.
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
# Turning a picture an image edit would refuse into a PNG, and reading a
# mask's size; already in the lock file under the window, which takes more
# of its formats.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

# Stopping a background job ends everything it started: a Job Object on
# Windows, a process group elsewhere. Both are already in the lock file,
# windows-sys at the version the window uses. Credential Manager keeps the
# keys and tokens on Windows.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Credentials", "Win32_System_JobObjects", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

# The login Keychain keeps the keys and tokens on macOS; already in the lock
# file under rustls-native-certs.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["workflows"]
# Orchestration scripts that run many agents at once. On by default, so CI
# builds, lints and tests it; a build without it leaves the runtime out.
workflows = []
