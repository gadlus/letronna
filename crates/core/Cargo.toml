[package]
name = "letronna-core"
description = "The agent: transport, tools, sessions and the loop, with no user interface"
version.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
async-channel.workspace = true
reqwest.workspace = true
chrono.workspace = true
# Checking that an update is signed and whole: ring is already here under
# rustls, and semver already in the lock file.
ring = "0.17"
semver = "1"
# Discord's Gateway, for hearing server mentions as they happen. Blocking
# like reqwest here, and on the same rustls.
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
# Refusing a Cargo.toml or pyproject.toml a write would break; toml 1 is
# already in the lock file, and only its parser is needed.
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
