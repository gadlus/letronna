[package]
name = "letronna-cli"
description = "Letronna in the terminal"
version.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true

# The name people type. The window is a separate binary it can launch.
[[bin]]
name = "letronna"
path = "src/main.rs"

[dependencies]
letronna-core.workspace = true
serde_json.workspace = true
async-channel.workspace = true
# When an editor's list of sessions says each was last used; already in the
# build for core.
chrono.workspace = true
# Raw keyboard input and cursor control, on both a Windows console and a
# terminal that speaks ANSI. Doing it by hand means SetConsoleMode on one and
# termios on the other, plus decoding key sequences.
crossterm = { version = "0.29", default-features = false, features = [
    "events",
    "windows",
    # Pasted text arrives as one event rather than as a burst of keystrokes,
    # so a pasted paragraph is one message and not one message per line.
    "bracketed-paste",
] }

# The bench starts the terminal in a pseudo-terminal of its own and reads its
# memory; libc is already in the lock file under the core.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
# The SHA-256 of an update staged by hand, which the updater checks before it
# installs one. Already in the build for core.
ring = "0.17"

# Whether `letronna serve` runs in its terminal's foreground, which only the
# C library can say. Already in the lock file, for other crates.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The wallet's sends, keys and rules wait for the system to confirm the user
# is there (presence.rs): Windows Hello, at the version the window uses, and
# LocalAuthentication through objc2, already in the lock file under gpui.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Foundation",
    "Security_Credentials_UI",
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_WinRT",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
