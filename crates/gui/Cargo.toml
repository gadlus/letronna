[package]
name = "letronna-gui"
description = "A small native desktop agent built with GPUI"
version.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true

[[bin]]
name = "letronna-gui"
path = "src/main.rs"

[dependencies]
letronna-core.workspace = true
serde_json.workspace = true
async-channel.workspace = true
reqwest.workspace = true
chrono.workspace = true
gpui = "=0.2.2"
gpui-component = "=0.5.1"
discord-rich-presence = "1"
image = "0.25"
# Already in the tree via gpui-component. The system says when the terminal
# writes a session, so the window follows it without polling the folder.
notify = "7"
# Plays speech a tool made, in the chat: playback and the formats voices come
# back in, and no recording.
rodio = { version = "0.22", default-features = false, features = ["playback", "mp3", "wav", "flac", "vorbis"] }

[target.'cfg(windows)'.dependencies]
tray-icon = "0.25"
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_System_Threading", "Win32_Security", "Win32_Graphics_Gdi", "Win32_Storage_Xps"] }
# Already in the tree via gpui. The shell's own thumbnailer gives the first
# frame of a video a tool made, as Explorer shows it, and Media Foundation
# decodes the video to play it in the chat.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    # Toasts, and the Start menu shortcut's AppUserModelID they are shown under.
    "Foundation",
    "Data_Xml_Dom",
    "UI_Notifications",
    "Win32_Storage_EnhancedStorage",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# Command Line Tools ship no `xcrun metal`, so let the Metal driver compile the
# shaders at startup rather than at build time.
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
# Both already in the tree via gpui; used to reach the NSWindow behind a gpui
# window and give it the dark appearance.
raw-window-handle = "0.6"
objc = "0.2"
# The completion handlers the user notification centre takes.
block = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
# KSNI speaks StatusNotifierItem over D-Bus on a worker thread, so there is no
# GTK main loop to reconcile with gpui's, and no appindicator/libxdo to install.
tray-icon = { version = "0.25", default-features = false, features = ["ksni"] }

[build-dependencies]
embed-resource = "3"
