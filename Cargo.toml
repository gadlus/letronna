# The agent is split so the terminal frontend does not have to drag a GPU UI
# framework in behind it: `core` is the whole agent with no idea what is
# driving it, and the two binaries are the ways of driving it.
[workspace]
members = ["crates/core", "crates/gui", "crates/cli"]
# Third-party code kept here as published: not ours to lint or format.
exclude = ["vendor"]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.2"
license = "MIT"
repository = "https://github.com/wweziza/letronna"
edition = "2024"

[workspace.dependencies]
letronna-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[patch.crates-io]
# gpui-pre-windows 0.3.8 -- zed's gpui_windows, the snapshot GPUI Kit 0.7.1
# pins -- as published on crates.io, less its Cargo.lock, so the Windows
# renderer can be changed without a fork of all of zed.
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }

[profile.release]
opt-level = 2
lto = "thin"
strip = true

[profile.dev]
debug = 0
