# The agent is split so the terminal frontend does not have to drag a GPU UI
# framework in behind it: `core` is the whole agent with no idea what is
# driving it, and the two binaries are the ways of driving it.
[workspace]
members = ["crates/core", "crates/gui", "crates/cli"]
# Third-party code kept here as published: not ours to lint or format.
exclude = ["vendor"]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.2"
license = "MIT"
repository = "https://github.com/wweziza/letronna"
edition = "2024"

[workspace.dependencies]
letronna-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[patch.crates-io]
# Fork of gpui-component 0.5.1 with two markdown fixes:
# - configurable heading gap (upstream longbridge/gpui-kit#3129)
# - list item content flexes instead of shrink-to-fit, so items are not
#   clipped to one character and do not widen the chat column
gpui-component = { git = "https://github.com/wweziza/gpui-kit", branch = "v0.5.1-heading-gap" }
# gpui 0.2.2 as published on crates.io, less its examples, so the renderer
# can be changed without a fork of all of zed. What differs from it:
# - Windows: the path textures (MSAA, 20 bytes a pixel) are made for the
#   first path a frame draws, and handed back to the driver 5 s after the last
#   or when the window leaves the front
gpui = { path = "vendor/gpui" }

[profile.release]
opt-level = 2
lto = "thin"
strip = true

[profile.dev]
debug = 0
